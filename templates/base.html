<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">
    <style>

    body{
        background: linear-gradient(
            135deg,
            #0f172a,
            #1e293b,
            #334155
        );
        min-height: 100vh;
        font-family: 'Poppins', sans-serif;
    }

    /* Sidebar */

    .sidebar{
        background: rgba(15,23,42,0.95);
        backdrop-filter: blur(10px);
        min-height: 100vh;
        box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    .sidebar h2{
        color: white;
        font-weight: bold;
    }

    .sidebar a{
        color: #cbd5e1;
        padding: 12px;
        display: block;
        border-radius: 10px;
        margin-bottom: 10px;
        transition: 0.3s;
        text-decoration: none;
    }

    .sidebar a:hover{
        background: linear-gradient(
            90deg,
            #2563eb,
            #7c3aed
        );
        color: white;
        transform: translateX(5px);
    }

    /* Dashboard Cards */

    .dashboard-card{
    border-radius: 20px;
    padding: 30px;
    color: white !important;
    transition: 0.4s;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    min-height: 180px;
    display: block;
    width: 100%;
}

    .dashboard-card:hover{
        transform: translateY(-10px) scale(1.03);
    }

    .blue-card{
        background: linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );
    }

    .green-card{
        background: linear-gradient(
            135deg,
            #059669,
            #047857
        );
    }

    .orange-card{
    background: linear-gradient(
        135deg,
        #ea580c,
        #c2410c
    ) !important;
}

    .red-card{
        background: linear-gradient(
            135deg,
            #dc2626,
            #991b1b
        );
    }

    /* Charts */

    .chart-box{
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 20px;
        color: white;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    /* Tables */

    table{
        background: white;
        border-radius: 15px;
        overflow: hidden;
    }

    th{
        background: #1e293b !important;
        color: white !important;
    }

    /* Buttons */

    .btn-primary{
        background: linear-gradient(
            90deg,
            #2563eb,
            #7c3aed
        );
        border: none;
    }

    .btn-success{
        background: linear-gradient(
            90deg,
            #059669,
            #10b981
        );
        border: none;
    }

    </style>
</head>
<body>

{% if messages %}

    {% for message in messages %}

        <div class="alert alert-info text-center">
            {{ message }}
        </div>

    {% endfor %}

{% endif %}

<nav class="navbar navbar-dark bg-dark p-3">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">
            Student Management System
        </span>
    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>
</body>
</html>
