{% extends 'base.html' %}

{% block content %}
<style>
    body{
        background: linear-gradient(
            135deg,
            #0f172a,
            #1e293b,
            #334155
        );
        min-height:100vh;
        font-family:Poppins,sans-serif;
    }

    .edit-card{
    background: rgba(30,41,59,0.96);
    backdrop-filter: blur(10px);
    border-radius:25px;
    padding:40px;
    color:white;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.edit-card h1{
    color:#3b82f6;
    font-weight:bold;
    margin-bottom:35px;
}

.edit-card label{
    color:#e2e8f0;
    font-weight:600;
    margin-bottom:10px;
}

.edit-card input,
.edit-card textarea{
    width:100%;
    background:#334155;
    border:1px solid #475569;
    color:white;
    border-radius:14px;
    padding:14px;
    margin-bottom:20px;
}

.edit-card textarea{
    min-height:180px;
}

.edit-card input:focus,
.edit-card textarea:focus{
    outline:none;
    border-color:#3b82f6;
    box-shadow:0 0 10px rgba(59,130,246,0.5);
}

.edit-card a{
    color:#60a5fa;
    text-decoration:none;
}

.update-btn{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:12px;
    font-weight:bold;
    margin-top:20px;
}

.update-btn:hover{
    transform:translateY(-2px);
    transition:0.3s;
}
</style>
<div class="container mt-5">

    <div class="edit-card">

        <h1>Edit Profile</h1>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <label>Contact</label>
            {{ form.contact }}

            <label>Address</label>
            {{ form.address }}

            <label>Photo</label>
            {{ form.photo }}

            <button type="submit" class="update-btn">
                Update Profile
            </button>

        </form>

    </div>

</div>
{% endblock %}
